<svg width="1400" height="720" viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo do GameBot AI</title>
  <desc id="desc">Diagrama do fluxo principal do sistema GameBot AI desde a entrada do usuário até a resposta da IA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#040d1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.28" flood-color="#020617"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#93c5fd"/>
    </marker>
    <style>
      .title { font: 700 32px 'Segoe UI', sans-serif; fill: #e2e8f0; }
      .label { font: 700 20px 'Segoe UI', sans-serif; fill: #f8fafc; }
      .small { font: 500 15px 'Segoe UI', sans-serif; fill: #dbeafe; }
      .pipe { stroke: #93c5fd; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="720" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">Fluxo do Sistema GameBot AI</text>

  <g filter="url(#shadow)">
    <rect x="70" y="220" width="200" height="150" rx="22" fill="url(#blue)"/>
    <text x="170" y="280" text-anchor="middle" class="label">Usuário</text>
    <text x="170" y="315" text-anchor="middle" class="small">Escreve a ideia</text>
    <text x="170" y="340" text-anchor="middle" class="small">do jogo</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="370" y="220" width="200" height="150" rx="22" fill="url(#purple)"/>
    <text x="470" y="280" text-anchor="middle" class="label">Frontend</text>
    <text x="470" y="315" text-anchor="middle" class="small">React + Vite</text>
    <text x="470" y="340" text-anchor="middle" class="small">/api/chat</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="670" y="220" width="220" height="150" rx="22" fill="url(#green)"/>
    <text x="780" y="280" text-anchor="middle" class="label">Backend</text>
    <text x="780" y="315" text-anchor="middle" class="small">Express + Routes</text>
    <text x="780" y="340" text-anchor="middle" class="small">Controller + Service</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="220" width="220" height="150" rx="22" fill="#1e293b" stroke="#67e8f9" stroke-width="2"/>
    <text x="1120" y="280" text-anchor="middle" class="label">OpenAI</text>
    <text x="1120" y="315" text-anchor="middle" class="small">Gera ideias</text>
    <text x="1120" y="340" text-anchor="middle" class="small">mecânicas e roteiro</text>
  </g>

  <path class="pipe" d="M270 295 H370"/>
  <path class="pipe" d="M570 295 H670"/>
  <path class="pipe" d="M890 295 H1010"/>

  <path class="pipe" d="M1120 370 V470 H280 V470"/>

  <g filter="url(#shadow)">
    <rect x="70" y="470" width="210" height="120" rx="18" fill="#0f172a" stroke="#a5b4fc" stroke-width="2"/>
    <text x="175" y="520" text-anchor="middle" class="label">Resposta</text>
    <text x="175" y="552" text-anchor="middle" class="small">Volta para o chat</text>
    <text x="175" y="575" text-anchor="middle" class="small">e exibe ao usuário</text>
  </g>

  <text x="310" y="182" class="small">1. ideia do usuário</text>
  <text x="610" y="182" class="small">2. envio da mensagem</text>
  <text x="928" y="182" class="small">3. processamento da IA</text>
  <text x="630" y="525" class="small">4. resposta final</text>
</svg>
