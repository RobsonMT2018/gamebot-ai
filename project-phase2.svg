<svg width="1400" height="760" viewBox="0 0 1400 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fase 2 do GameBot AI</title>
  <desc id="desc">Diagrama da Fase 2 mostrando painel de projetos, ações rápidas, geração de personagens e missões e chat melhorado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#030c18"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity="0.22" flood-color="#000000"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#93c5fd"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #e2e8f0; }
      .label { font: 700 20px 'Segoe UI', sans-serif; fill: #f8fafc; }
      .small { font: 500 15px 'Segoe UI', sans-serif; fill: #dbeafe; }
      .pipe { stroke: #93c5fd; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <text x="700" y="60" text-anchor="middle" class="title">Fase 2 — GameBot AI</text>

  <g filter="url(#shadow)">
    <rect x="80" y="140" width="250" height="470" rx="20" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="205" y="180" text-anchor="middle" class="label">Painel de projetos</text>
    <rect x="110" y="215" width="190" height="48" rx="10" fill="#111827" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="205" y="246" text-anchor="middle" class="small">Novo projeto</text>
    <rect x="110" y="285" width="190" height="70" rx="12" fill="url(#blue)"/>
    <text x="205" y="315" text-anchor="middle" class="small">Neon Drift</text>
    <text x="205" y="338" text-anchor="middle" class="small">Corrida cyberpunk</text>
    <rect x="110" y="370" width="190" height="70" rx="12" fill="#1f2937" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="205" y="400" text-anchor="middle" class="small">Dungeon Echo</text>
    <text x="205" y="423" text-anchor="middle" class="small">RPG em masmorras</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="140" width="930" height="470" rx="20" fill="#0b1220" stroke="#a78bfa" stroke-width="2"/>
    <text x="855" y="180" text-anchor="middle" class="label">Chat + ideias + contexto</text>

    <rect x="430" y="220" width="850" height="75" rx="14" fill="#111827" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="855" y="250" text-anchor="middle" class="small">Cabeçalho com projeto ativo e status online</text>
    <text x="855" y="272" text-anchor="middle" class="small">Crie. Codifique. Jogue.</text>

    <rect x="430" y="315" width="850" height="90" rx="14" fill="#1f2937" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="855" y="350" text-anchor="middle" class="small">Ações rápidas</text>
    <text x="855" y="380" text-anchor="middle" class="small">Criar personagem / missão / fase / ideia principal</text>

    <rect x="430" y="425" width="390" height="120" rx="14" fill="#1f2937" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="625" y="460" text-anchor="middle" class="small">Mensagem do usuário</text>
    <text x="625" y="488" text-anchor="middle" class="small">Quero uma ideia para um jogo 2D cyberpunk</text>

    <rect x="890" y="425" width="390" height="120" rx="14" fill="url(#green)"/>
    <text x="1085" y="460" text-anchor="middle" class="small">Resposta do GameBot AI</text>
    <text x="1085" y="490" text-anchor="middle" class="small">Personagem, missão e fase sugeridas</text>
  </g>

  <path class="pipe" d="M330 330 H390"/>
  <path class="pipe" d="M855 610 V660 H260 V660"/>

  <g filter="url(#shadow)">
    <rect x="80" y="650" width="1180" height="90" rx="18" fill="url(#purple)"/>
    <text x="700" y="690" text-anchor="middle" class="label">Resultado da Fase 2</text>
    <text x="700" y="718" text-anchor="middle" class="small">Chat melhorado, painel de projetos, ações rápidas, melhor contexto e geração estruturada de ideias de jogo</text>
  </g>
</svg>
