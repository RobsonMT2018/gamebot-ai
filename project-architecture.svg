<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Estrutura do projeto GameBot AI</title>
  <desc id="desc">Diagrama da arquitetura do projeto com frontend React, backend Express e integração com OpenAI.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" x2="1">
      <stop offset="0%" stop-color="#133a5b"/>
      <stop offset="100%" stop-color="#1a5f8c"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0" x2="1">
      <stop offset="0%" stop-color="#3a1f5b"/>
      <stop offset="100%" stop-color="#5c2d7d"/>
    </linearGradient>
    <linearGradient id="cardGreen" x1="0" x2="1">
      <stop offset="0%" stop-color="#0d3b2f"/>
      <stop offset="100%" stop-color="#1d785a"/>
    </linearGradient>
    <linearGradient id="cardOrange" x1="0" x2="1">
      <stop offset="0%" stop-color="#5b3410"/>
      <stop offset="100%" stop-color="#b86a1f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity="0.35" flood-color="#000000"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', sans-serif; fill: #e2e8f0; }
      .subtitle { font: 600 18px 'Segoe UI', sans-serif; fill: #9ad7ff; }
      .label { font: 600 22px 'Segoe UI', sans-serif; fill: #f8fafc; }
      .small { font: 500 16px 'Segoe UI', sans-serif; fill: #dbeafe; }
      .tiny { font: 500 14px 'Segoe UI', sans-serif; fill: #dfe7f5; }
      .box { fill: url(#cardBlue); stroke: #7dd3fc; stroke-width: 2; rx: 18; }
      .boxAlt { fill: url(#cardPurple); stroke: #c084fc; stroke-width: 2; rx: 18; }
      .boxGreen { fill: url(#cardGreen); stroke: #86efac; stroke-width: 2; rx: 18; }
      .boxOrange { fill: url(#cardOrange); stroke: #fbbf24; stroke-width: 2; rx: 18; }
      .pipe { stroke: #7dd3fc; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .pipePurple { stroke: #c084fc; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .pipeGreen { stroke: #86efac; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="url(#bg)"/>

  <text x="800" y="70" text-anchor="middle" class="title">GameBot AI - Estrutura do Projeto</text>
  <text x="800" y="105" text-anchor="middle" class="subtitle">Fluxo principal: interface → API → IA → resposta para o usuário</text>

  <g filter="url(#shadow)">
    <rect x="80" y="150" width="430" height="465" class="box"/>
    <text x="295" y="190" text-anchor="middle" class="label">gamebot-ai</text>
    <text x="295" y="220" text-anchor="middle" class="small">Projeto raiz</text>

    <rect x="120" y="260" width="350" height="68" fill="#0f172a" stroke="#7dd3fc" stroke-width="2" rx="12"/>
    <text x="295" y="303" text-anchor="middle" class="small">package.json</text>
    <text x="295" y="326" text-anchor="middle" class="tiny">Scripts: dev, client, server, build</text>

    <rect x="120" y="350" width="170" height="220" fill="#102a46" stroke="#7dd3fc" stroke-width="2" rx="12"/>
    <text x="205" y="385" text-anchor="middle" class="small">client/</text>
    <text x="205" y="415" text-anchor="middle" class="tiny">React + Vite</text>
    <text x="205" y="445" text-anchor="middle" class="tiny">App.jsx</text>
    <text x="205" y="470" text-anchor="middle" class="tiny">App.css</text>
    <text x="205" y="495" text-anchor="middle" class="tiny">main.jsx</text>
    <text x="205" y="520" text-anchor="middle" class="tiny">vite.config.js</text>

    <rect x="310" y="350" width="160" height="220" fill="#102a46" stroke="#7dd3fc" stroke-width="2" rx="12"/>
    <text x="390" y="385" text-anchor="middle" class="small">server/</text>
    <text x="390" y="415" text-anchor="middle" class="tiny">Node + Express</text>
    <text x="390" y="445" text-anchor="middle" class="tiny">.env</text>
    <text x="390" y="470" text-anchor="middle" class="tiny">src/server.js</text>
    <text x="390" y="495" text-anchor="middle" class="tiny">routes/</text>
    <text x="390" y="520" text-anchor="middle" class="tiny">controllers/</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="610" y="150" width="420" height="470" class="boxAlt"/>
    <text x="820" y="190" text-anchor="middle" class="label">Frontend (client)</text>
    <text x="820" y="220" text-anchor="middle" class="small">React + Vite + CSS</text>

    <rect x="650" y="260" width="340" height="80" fill="#1f1236" stroke="#c084fc" stroke-width="2" rx="12"/>
    <text x="820" y="297" text-anchor="middle" class="small">src/App.jsx</text>
    <text x="820" y="320" text-anchor="middle" class="tiny">Formulário de chat e renderização das mensagens</text>

    <rect x="650" y="380" width="340" height="90" fill="#1f1236" stroke="#c084fc" stroke-width="2" rx="12"/>
    <text x="820" y="418" text-anchor="middle" class="small">API call</text>
    <text x="820" y="442" text-anchor="middle" class="tiny">fetch('/api/chat')</text>
    <text x="820" y="462" text-anchor="middle" class="tiny">via Vite proxy → http://localhost:5000</text>

    <rect x="650" y="500" width="340" height="80" fill="#1f1236" stroke="#c084fc" stroke-width="2" rx="12"/>
    <text x="820" y="537" text-anchor="middle" class="small">UX / Interface</text>
    <text x="820" y="560" text-anchor="middle" class="tiny">Dark mode, cards, bot message, input + botão</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1090" y="150" width="430" height="470" class="boxGreen"/>
    <text x="1305" y="190" text-anchor="middle" class="label">Backend (server)</text>
    <text x="1305" y="220" text-anchor="middle" class="small">Express + OpenAI</text>

    <rect x="1130" y="260" width="350" height="80" fill="#0f2d1f" stroke="#86efac" stroke-width="2" rx="12"/>
    <text x="1305" y="297" text-anchor="middle" class="small">src/server.js</text>
    <text x="1305" y="320" text-anchor="middle" class="tiny">Configura CORS, JSON e monta rotas da API</text>

    <rect x="1130" y="370" width="350" height="85" fill="#0f2d1f" stroke="#86efac" stroke-width="2" rx="12"/>
    <text x="1305" y="406" text-anchor="middle" class="small">routes + controllers</text>
    <text x="1305" y="431" text-anchor="middle" class="tiny">POST /api/chat → valida entrada → chama serviço</text>

    <rect x="1130" y="485" width="350" height="100" fill="#0f2d1f" stroke="#86efac" stroke-width="2" rx="12"/>
    <text x="1305" y="522" text-anchor="middle" class="small">service: gamebotService.js</text>
    <text x="1305" y="548" text-anchor="middle" class="tiny">Verifica OPENAI_API_KEY</text>
    <text x="1305" y="570" text-anchor="middle" class="tiny">Chama OpenAI ou usa fallback</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="700" width="600" height="170" class="boxOrange"/>
    <text x="800" y="742" text-anchor="middle" class="label">Função do sistema</text>
    <text x="800" y="778" text-anchor="middle" class="small">1. Usuário escreve uma ideia de jogo</text>
    <text x="800" y="812" text-anchor="middle" class="small">2. Frontend envia para /api/chat</text>
    <text x="800" y="846" text-anchor="middle" class="small">3. Backend valida a mensagem, chama a OpenAI e retorna a resposta criativa</text>
  </g>

  <path class="pipe" d="M510 420 C560 420, 560 420, 610 420"/>
  <path class="pipePurple" d="M1030 420 C1060 420, 1070 420, 1090 420"/>
  <path class="pipeGreen" d="M1305 620 L1305 700"/>
  <path class="pipePurple" d="M800 620 L800 700"/>

  <text x="560" y="400" class="tiny">frontend → backend</text>
  <text x="1045" y="400" class="tiny">/api/chat</text>
  <text x="1318" y="665" class="tiny">IA</text>
  <text x="776" y="665" class="tiny">resposta</text>
</svg>
