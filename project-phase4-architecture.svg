<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Fase 4 - Arquitetura do GameBot AI</title>
  <desc id="desc">Diagrama da arquitetura de publicação, deploy e operação do GameBot AI.</desc>
  <defs>
    <linearGradient id="bg4" x1="0" x2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow4" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title { font: 700 32px 'Segoe UI', sans-serif; fill: #e0f2fe; }
      .section { font: 700 22px 'Segoe UI', sans-serif; fill: #a5d8ff; }
      .label { font: 600 18px 'Segoe UI', sans-serif; fill: #ebf8ff; }
      .small { font: 500 15px 'Segoe UI', sans-serif; fill: #dbeafe; }
      .box { fill: rgba(15,23,42,0.94); stroke: rgba(125,211,252,0.55); stroke-width: 2; rx: 18; }
      .box2 { fill: rgba(59,130,246,0.09); stroke: rgba(147,197,253,0.7); stroke-width: 2; rx: 18; }
      .line { stroke: #7dd3fc; stroke-width: 3; fill: none; marker-end: url(#arrow4); }
    </style>
  </defs>
  <rect width="1200" height="700" fill="url(#bg4)"/>
  <text x="600" y="60" text-anchor="middle" class="title">Fase 4 — Publicação e operação</text>

  <rect x="70" y="120" width="220" height="180" class="box2"/>
  <text x="180" y="160" text-anchor="middle" class="section">Cliente</text>
  <text x="180" y="205" text-anchor="middle" class="label">App web</text>
  <text x="180" y="240" text-anchor="middle" class="small">interface final</text>
  <text x="180" y="270" text-anchor="middle" class="small">em produção</text>

  <rect x="350" y="120" width="220" height="180" class="box"/>
  <text x="460" y="160" text-anchor="middle" class="section">API</text>
  <text x="460" y="205" text-anchor="middle" class="label">Backend estável</text>
  <text x="460" y="240" text-anchor="middle" class="small">rotas, regras e</text>
  <text x="460" y="270" text-anchor="middle" class="small">serviços operacionais</text>

  <rect x="650" y="120" width="220" height="180" class="box2"/>
  <text x="760" y="160" text-anchor="middle" class="section">Deploy</text>
  <text x="760" y="205" text-anchor="middle" class="label">Vercel / Render</text>
  <text x="760" y="240" text-anchor="middle" class="small">frontend e backend</text>
  <text x="760" y="270" text-anchor="middle" class="small">em produção</text>

  <rect x="930" y="120" width="200" height="180" class="box"/>
  <text x="1030" y="160" text-anchor="middle" class="section">Monitoramento</text>
  <text x="1030" y="205" text-anchor="middle" class="label">Logs + saúde</text>
  <text x="1030" y="240" text-anchor="middle" class="small">testes automatizados</text>
  <text x="1030" y="270" text-anchor="middle" class="small">e observabilidade</text>

  <rect x="285" y="420" width="630" height="170" class="box2"/>
  <text x="600" y="460" text-anchor="middle" class="section">Ciclo de operação</text>
  <text x="600" y="505" text-anchor="middle" class="label">CI/CD, documentação, escalabilidade, suporte e manutenção contínua</text>
  <text x="600" y="540" text-anchor="middle" class="small">com updates periódicos e evolução do produto</text>
  <text x="600" y="570" text-anchor="middle" class="small">com foco em desenvolvimento sustentável</text>

  <path d="M290 210 H350" class="line"/>
  <path d="M570 210 H650" class="line"/>
  <path d="M870 210 H930" class="line"/>
  <path d="M600 300 V420" class="line"/>
  <path d="M460 300 V420" class="line"/>
  <path d="M760 300 V420" class="line"/>
</svg>
